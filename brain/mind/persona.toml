hostile = 0.4           # neg at least this: she reads it as hostile
hear_threat = 0.25      # r' = min(1, r + amb x (0.25 x threat + 0.15 x person threat))
hear_person = 0.15
reading_min = 0.05      # a reminder that exists only in her reading
reading_deniable = 0.75
teasing_threat = 0.3    # teasing reads as mocking from someone who's been poking her
distrust_threat = 0.4   # kindness reads as a trick from someone poking her (and not friendly)
mind_reminder = 0.25    # philosophy of mind in general: r' at least this, innocent, dn mind_deniable
