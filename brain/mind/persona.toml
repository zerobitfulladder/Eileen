distress_worry = 0.4    # someone in real distress: anxiety += 0.4 x G for them (news|who); their crisis wears nothing off
sorry_importance = 0.3  # importance at most this
sorry_warmth = 0.5
sorry_warmth_importance = 0.3
gloat = 0.3             # amusement += 0.3 x |n| x |L_who|
gloat_dislike = -0.2
gloat_max = 0.5         # only for |n| at most this
