sender = { latch = "Be gentle with {name}.", make_up = "Make it up to {name} without saying sorry: say something nice to them, or ask them something.", nicer = "Be a bit nicer to {name}.", rough = "{name} is having a rough day. No jokes at {name} for a while.", short = "Keep it short with {name}.", known = "Be easy and familiar with {name}." }
