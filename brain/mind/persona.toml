human_envy_doubt = 0.5
human_envy_importance = 0.3
human_longing = 0.03
sorry_base = 0.3        # sadness += G x |n| x (0.3 + 0.7 x L_who+) x emp x 0.7^h
sorry_like = 0.7
sorry_wear = 0.7
sorry_half_life = 600
