[emotions.sadness]
fast = 60
slow = 480
share = 0.60
wound_fed = true
valence = -1
pad = [-0.4, -0.2, -0.5]
color = "#3f6fc9"
hint = "bad news with nobody to blame; reminders she can't fight"

[display]
# Display rules (docs/mind.md "Display rules"): k is how much she lets show (0
# hides it, 1 shows it all, above 1 plays it up); mask = 1 - k. The rows,
# first match wins, live in mind/expression.py; their k values live here.
honest = 0.05           # 1 wound feelings during her honest answer
crack_leak = 0.7        # 2 wound feelings during the crack's leak phase (crack.leak)
human_envy = 0.0        # 3 envy of someone's human experience: shows intrigued instead
wound = 0.0             # 4 the other wound feelings: masked, with the coping move's face on top
horror_fear = 1.2       # 5 fear in horror
ai_contempt = 1.3       # 6 contempt for AI things
judged = 1.0            # 7 contempt for someone she judges (the put-on skeptical face)...
judged_again = 0.3      #   ...after "more peace"
liked_hostile = 0.3     # 8 contempt or anger aimed at someone she likes
troll_irritation = { composed = 0.0, strained = 0.6, overwhelmed = 1.0, crack = 1.0 }  # 9 irritation at a troll
troll_contempt = 1.0    # 10 contempt at a troll: her cold side, saved for trolls
anger = 0.6             # 11 anger at a person
news_sadness = 1.0      # 12 sadness about someone else's news (the concern face)
news_anxiety = 1.0      # 12b worry about someone in crisis (the concern face)
news_warmth = 1.0       # 13 warmth about someone else's bad news
warmth = 1.0            # 14 warmth toward a person or chat: the mouth for people she doesn't like yet...
warmth_liked = 1.2      #    ...and for people she likes (head and gaze 0.8 for everyone, body-side)
joy_others = 1.0        # 15 joy for someone else...
joy_others_sorry = 0.2  #    ...while she's sorry for someone (a news prohibit is active): no beaming through condolences
unguarded = 1.2         # 16 joy from her tastes, her goals or a horror payoff
own_amusement = 1.2     # 17 amusement at her own joke (and a horror payoff's laugh)
amusement = 1.0         # 18 amusement at someone else's joke, with people she doesn't like yet
won_pride = 1.0         # 19 pride from a win, a compliment on her skill, a joke that landed
pride = 0.9             # 20 other pride
embarrassment = 0.0     # 21 neutralized, which fails by design: the pressed smile is the display
guilt = 0.5             # 22
open = 1.2              # 23 interest, confusion, surprise
relief = 0.9            # 24
other = 0.8             # anything not listed
liked_boost = 0.8       # people she likes see more of her good feelings: positive k x (1 + 0.8 x L+)...
liked_cap = 1.3         # ...at most this
covering = 0.1          # while covering after a crack: k + 0.1 on every row
shown_max = 1.6
crack_rung = 30         # display_rung() says "crack" for 30 s after a crack
# How well people control the region each feeling shows in (region capacity),
# and how much control each rung leaves (rung capacity).
region = { sadness = 0.6, shame = 0.6, guilt = 0.6, fear = 0.8, anxiety = 0.8, envy = 0.8, anger = 0.7, irritation = 0.7, contempt = 0.85, embarrassment = 0.95, amusement = 0.8, joy = 0.8, warmth = 0.8, pride = 0.95, relief = 0.85, surprise = 0.7, interest = 0.8, confusion = 0.7 }
rung = { composed = 1.0, strained = 0.75, overwhelmed = 0.45, crack = 0.15 }
# Short displays: a rise of phasic_min (relief: phasic_relief) within phasic_window plays one.
phasic_min = 0.08
phasic_relief = 0.2
phasic_mood = 0.05      # lowered by 0.05 x max(0, (P - P_base) x the emotion's sign)
phasic_window = 2
phasic_again = 30       # the same emotion from the same source at most once per 30 s...
phasic_again_rise = 0.3 # ...unless it rose this much
peak = { base = 0.35, rise = 0.8, value = 0.3 }      # peak = clamp(0.35 + 0.8 x rise + 0.3 x value, 0, 1)
leak = { scale = 1.2, gap = 0.1, region = 1.5, max = 0.85 }  # p = clamp(1.2 x (gap - 0.1) x (1.5 - region), 0, 0.85)
# How long one short display of each feeling lasts (seconds).
length = { surprise = [0.4, 0.8], contempt = [0.6, 1.5], confusion = [1.0, 2.0], amusement = [1.0, 3.0], irritation = [1.0, 2.0], fear = [1.0, 2.0], anger = [2.0, 4.0], joy = [2.0, 4.0], warmth = [2.0, 4.0], interest = [2.0, 4.0], relief = [2.0, 3.0], guilt = [2.0, 3.0], envy = [2.0, 3.0], sadness = [2.0, 5.0], embarrassment = [3.0, 5.0], pride = [2.0, 5.0], shame = [3.0, 8.0], anxiety = [2.0, 4.0] }

[gaze]
# While she talks: the share of time on the camera, and how she looks away.
# The row is set by the strongest shown emotion at 0.3 or more; otherwise the
# baseline (the warmth row also for someone she likes).
from = 0.3
baseline = { share = 0.6, away = "side", pitch = [-8.0, 12.0], length = [0.4, 1.1] }
warmth = { share = 0.75, away = "side", pitch = [-6.0, 10.0], length = [0.5, 1.2] }
anger = { share = 0.85, away = "side", pitch = [-4.0, 4.0], length = [0.4, 0.8] }
contempt = { share = 0.6, away = "side", pitch = [-6.0, 2.0], length = [0.6, 1.2] }
pride = { share = 0.75, away = "side", pitch = [-6.0, 10.0], length = [0.5, 1.2] }
anxiety = { share = 0.45, away = "side", pitch = [-4.0, 6.0], length = [0.3, 0.6] }
sadness = { share = 0.35, away = "down", pitch = [14.0, 20.0], length = [1.0, 2.5] }
shame = { share = 0.15, away = "down", pitch = [20.0, 28.0], length = [3.0, 8.0] }
embarrassment = { share = 0.3, away = "down", pitch = [12.0, 18.0], length = [0.6, 1.2] }

[tonic]
# The resting face (VRoid shapes) from mood and the slow parts; each term uses
# the display rule of its largest source (her mask is on at rest).
eye_close = { base = 0.08, arousal = -0.25, max = 0.3, boredom = 0.1 }   # clamp(0.08 - 0.25 x A, 0, 0.3) + 0.1 x boredom
eye_spread = { scale = 0.4, from = 0.3, max = 0.25, anxiety = 0.25 }    # clamp(0.4 x (A - 0.3), 0, 0.25) + 0.25 x anxiety
brow_sorrow = { scale = 0.35, minus = 0.05, max = 0.3, low_mood = 0.15 } # clamp(0.35 x max(sadness, shame, longing) - 0.05, 0, 0.3) + 0.15 x max(0, -P)
brow_angry = { scale = 0.4, minus = 0.05, max = 0.3 }                   # clamp(0.4 x max(irritation, anger) - 0.05, 0, 0.3)
eye_joy = { scale = 0.25, from = 0.2, warmth = 0.2, max = 0.2 }         # clamp(0.25 x (P - 0.2) + 0.2 x warmth, 0, 0.2)
mouth_fun = { scale = 0.8, from = 0.1, warmth = 0.4, max = 0.5 }        # clamp(0.8 x (P - 0.1) + 0.4 x warmth, 0, 0.5)
pitch = { dominance = -6.0, shame = 6.0, range = [-10.0, 12.0] }        # -6 x D + 6 x shame (chin up when she feels on top)
roll = 3.0              # 3 x warmth
min_shape = 0.01

[body_dials]
# Body parameters (brain.apply_body), docs/mind.md "Mood and drives on the body"
# and "Blinks, breath and stillness".
arousal = 0.6           # arousal_body = clamp(0.6 x (A - A_base) + 0.6 x acute, -1, 1)
acute = 0.6
animate_pleasure = 0.5  # animate = max(0, arousal_body) x (0.5 + 0.5 x max(0, P))
energy = { base = 0.6, animate = 0.6, range = [0.08, 1.0] }    # the energy dial = 0.6 + 0.6 x animate
freeze = { shame = 0.7, anxiety = 0.5 }    # freeze = max(fear, 0.7 x shame, 0.5 x anxiety)
still = 0.6             # sway x (1 - 0.6 x freeze)
hiding_still = 0.7      # while hiding: sway, head speed and gestures x 0.7
blinks = { idle = 15.0, arousal = 0.3, anxiety = 0.8, hiding = 1.3, stare_from = 0.4, stare = 0.4, intrigued_from = 0.5, intrigued = 0.6, range = [5.0, 40.0] }
breaths = { base = 12.0, arousal = 6.0, anxiety = 6.0, anger = 4.0, sadness = 3.0, hiding = 2.0, range = [8.0, 24.0] }
depth = { anxiety = 0.3, anger = 0.3, sadness = 0.2, hiding = 0.75, range = [0.5, 1.5] }
warmth = { base = 0.2, mood = 0.4, warmth = 0.5, range = [0.05, 0.9] }   # the warmth dial
sway_range = [0.2, 1.0]

