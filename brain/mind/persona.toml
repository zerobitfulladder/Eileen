energy_hold = 30        # each energy line changes at most once per 30 s...
energy_band = 0.05      # ...with a +-0.05 band so it doesn't flicker
prickly_friend = 0.1    # prickly from someone else's pokes: to someone she likes (irritation + anger at them below this) it shows as low
